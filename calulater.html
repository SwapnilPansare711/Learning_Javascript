<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container d-flex ">
      <div class="row">
        <div class="col-md-12">
            <h3>Calculater</h3>
            <form name="myform" style="border: 2px double black; padding: 30px;">
                <div class="mb-3">
                    <label for="n1" class="form label">Number 1:</label>
                    <input type="number" name="n1" class="from-control">
                </div>

                <div class="mb-3">
                    <label for="n2" class="form label">Number 2:</label>
                    <input type="number" name="n2" class="from-control">
                </div>

                <div class="text-center">
                    <button class="btn btn-danger me-2" type="button" onclick="add()">+</button>
                    <button class="btn btn-danger me-2" type="button" onclick="sub()">-</button>
                    <button class="btn btn-danger me-2" type="button" onclick="multi()">*</button>
                    <button class="btn btn-danger me-2" type="button" onclick="div()">/</button>
                    <button class="btn btn-danger me-2" type="button" onclick="Reset">Reset</button>
                    
                </div>

                <div class="mb-3">
                    <label for="res" class="form label">Result:</label>
                    <input type="number" name="res" class="from-control" disabled>
                </div>
            </form>
        </div>
      </div>

    </div>

    <script>
        var a,b,result;

        function add()
        {
            a=Number(document.myform.n1.value);
            b=Number(document.myform.n2.value);
            result=a+b;

            document.myform.res.value=result.toFixed(2);
        }

        function sub()
        {
            a=Number(document.myform.n1.value);
            b=Number(document.myform.n2.value);
            result=a-b;

            document.myform.res.value=result.toFixed(2);
        }

        function multi()
        {
            a=Number(document.myform.n1.value);
            b=Number(document.myform.n2.value);
            result=a*b;

            document.myform.res.value=result.toFixed(2);
        }

        function div()
        {
            a=Number(document.myform.n1.value);
            b=Number(document.myform.n2.value);
            result=a/b;

            document.myform.res.value=result.toFixed(2);
        }
    </script>
   
   
    
   
    

<script src="script.js"></script>
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</html>
