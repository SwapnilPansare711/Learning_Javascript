<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var a = Math.round(10.6);
        document.write(`Round of value round : ${a} <br>`);
        var b = Math.trunc(10.6);
        document.write(`Round of value trunc : ${b}<br>`);
        var c = Math.ceil(6.18);
        document.write(`Round of value ceil : ${c}<br>`);
        var d = Math.floor(6.98);
        document.write(`Round of value floor : ${d}<br>`);
        var e = Math.max(56,89,7,11,34,52,89);
        document.write(`max value : ${e}<br>`);

        var e = Math.min(56,89,7,11,34,52,89);
        document.write(`min value : ${e}<br>`);

        var f = Math.sqrt(81);
        document.write(`squre root : ${f}<br>`);

        var g = Math.cbrt(125);
        document.write(`cube root : ${g}<br>`);

        var h = Math.pow(3,4);
        document.write(`Power : ${h} <br> `);

        var i = Math.random();
        document.write(`Random value : ${i} <br>`);

        var j = Math.floor(Math.random()*1000);
        document.write(`Random value : ${j} <br> `);

        


    </script>
</body>
</html>
